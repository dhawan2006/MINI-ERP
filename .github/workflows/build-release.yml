name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger when a tag like v1.0.0 is pushed
  workflow_dispatch: # Allow running manually from the GitHub Actions UI

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build and Package App (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run package:mac:universal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Production URL environment variables go here
          VITE_LICENSING_SERVER_URL: ${{ secrets.VITE_LICENSING_SERVER_URL }}
          VITE_LICENSING_SERVER_KEY_ID: ${{ secrets.VITE_LICENSING_SERVER_KEY_ID }}
          VITE_LICENSING_SERVER_PUBLIC_KEY: ${{ secrets.VITE_LICENSING_SERVER_PUBLIC_KEY }}

      - name: Build and Package App (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run package:win:x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Production URL environment variables go here
          VITE_LICENSING_SERVER_URL: ${{ secrets.VITE_LICENSING_SERVER_URL }}
          VITE_LICENSING_SERVER_KEY_ID: ${{ secrets.VITE_LICENSING_SERVER_KEY_ID }}
          VITE_LICENSING_SERVER_PUBLIC_KEY: ${{ secrets.VITE_LICENSING_SERVER_PUBLIC_KEY }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mini-pos-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
